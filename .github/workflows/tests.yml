name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Syntax checks
        run: |
          python -m py_compile run_voris.py api/api_server.py
          node --check interface/web_v2/app.js
          node --check interface/web_v2/auth.js

      - name: Run tests
        # run_tests.py, not `unittest discover -s tests`: discover reaches only
        # the 35 modules under tests/ and silently skips the 16 in
        # security/tests/ and 4 in agents/experimental/tests/, because neither
        # is an importable package. That hid a real failing security test.
        run: |
          python run_tests.py
